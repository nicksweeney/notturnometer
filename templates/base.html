<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Notturnometer{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg{% if favicon_version %}?v={{ favicon_version }}{% endif %}">
<link rel="stylesheet" href="/static/style.css{% if style_version %}?v={{ style_version }}{% endif %}">
<link rel="alternate" type="application/atom+xml" title="Notturnometer — last nights" href="/feed.xml">
</head>
<body>
<header>
<a class="wordmark" href="/">Notturnometer</a>
<div id="search">
	<form id="search-form" action="/search/" method="get" role="search">
		<input id="search-input" type="search" name="q" placeholder="Search"
		       autocomplete="off" aria-label="Search works, composers, performers and nights"
		       aria-expanded="false" aria-controls="search-results">
	</form>
	<ul id="search-results" role="listbox" aria-label="Search results" hidden></ul>
</div>
<nav>
<a href="{{ url_for('browse', '') }}">Browse</a>
<a href="/about/">About</a>
</nav>
</header>
{% block content %}{% endblock %}
<footer>
	<p>Programme data from BBC Radio 3's <em><a href="https://www.bbc.co.uk/programmes/b006tmq9">Through the Night</a></em>. All programme links go to <a href="https://www.bbc.co.uk/">bbc.co.uk</a>. A <a href="http://permanent.red">permanent.red</a> production.</p>
{% if built_at %}<p>Built {{ built_at }}.</p>{% endif %}
</footer>
<script src="/static/minisearch.min.js{% if style_version %}?v={{ style_version }}{% endif %}" defer></script>
<script src="/static/search.js{% if style_version %}?v={{ style_version }}{% endif %}" defer></script>
</body>
</html>
